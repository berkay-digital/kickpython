name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy
      - run: uv run mypy --strict examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [highest]
        include:
          - python: "3.10"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run --isolated --python ${{ matrix.python }} --resolution ${{ matrix.resolution }} --group dev pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv build
      - run: uvx twine check --strict dist/*
